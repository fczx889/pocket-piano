
name: Build Pocket Piano APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -eux
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null || true
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android SDK verified"

      - name: Create Android project
        shell: bash
        run: |
          set -eux
          mkdir -p app/src/main/java/com/pocketpiano/app
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PocketPiano"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pocketpiano.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.pocketpiano.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="口袋钢琴"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/pocketpiano/app/MainActivity.java <<'EOF'
          package com.pocketpiano.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  web.setBackgroundColor(0xFFFFF8EF);
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <title>口袋钢琴</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#fff8ef;color:#34264a;font-family:system-ui;text-align:center}
          header{padding:24px 12px 12px;background:#7554a8;color:white}
          h1{margin:0;font-size:28px}
          .panel{padding:16px 6px}
          .controls button,.lesson button{border:0;border-radius:12px;padding:12px 16px;margin:5px;background:#7554a8;color:white;font-size:16px}
          .keys{display:flex;height:210px;margin:20px 2px}
          .key{flex:1;min-width:0;border:1px solid #444;background:white;color:#333;display:flex;align-items:flex-end;justify-content:center;padding:0 0 12px;font-size:11px;touch-action:manipulation}
          .key:active{background:#e5d9ff}
          .lesson{background:white;border-radius:16px;padding:14px;margin:12px 4px}
          </style>
          </head>
          <body>
          <header><h1>🎹 口袋钢琴</h1><p>随时随地，弹奏你的音乐</p></header>
          <div class="panel">
          <div class="controls">
          <button onclick="playSong()">▶ 播放练习曲</button>
          <button onclick="stopSong()">■ 停止</button>
          </div>
          <div class="keys" id="keys"></div>
          <div class="lesson">
          <h3>🎵 新手教程</h3>
          <p>白键从左到右：Do、Re、Mi、Fa、Sol、La、Si、Do</p>
          <button onclick="lesson()">开始教学</button>
          <p id="tip">点击任意琴键开始演奏！</p>
          </div>
          </div>
          <script>
          const names=['Do','Re','Mi','Fa','Sol','La','Si','Do'];
          const freqs=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];
          let ctx=null,timers=[],lessonStep=-1;

          function play(i){
            ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();
            if(ctx.state==='suspended')ctx.resume();
            const o=ctx.createOscillator(),g=ctx.createGain();
            o.type='sine';
            o.frequency.value=freqs[i];
            g.gain.setValueAtTime(0.0001,ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+0.02);
            g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.65);
            o.connect(g);
            g.connect(ctx.destination);
            o.start();
            o.stop(ctx.currentTime+0.7);
          }

          names.forEach((name,i)=>{
            const b=document.createElement('button');
            b.className='key';
            b.textContent=name;
            b.addEventListener('pointerdown',e=>{
              e.preventDefault();
              play(i);
              if(lessonStep>=0){
                if(i===lessonStep){
                  lessonStep++;
                  showLesson();
                }else{
                  document.getElementById('tip').textContent='再试一次，点击正确的琴键哦';
                }
              }
            });
            document.getElementById('keys').appendChild(b);
          });

          function stopSong(){
            timers.forEach(clearTimeout);
            timers=[];
          }

          function playSong(){
            stopSong();
            [0,0,4,4,5,5,4,3,3,2,2,1,1,0].forEach((n,i)=>{
              timers.push(setTimeout(()=>play(n),i*450));
            });
          }

          function lesson(){
            lessonStep=0;
            showLesson();
          }

          function showLesson(){
            const tip=document.getElementById('tip');
            if(lessonStep>=names.length){
              lessonStep=-1;
              tip.textContent='太棒了！第一课完成 🎉';
            }else{
              tip.textContent='请点击 '+names[lessonStep]+' 键';
            }
          }
          </script>
          </body>
          </html>
          EOF

      - name: Set up Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-piano-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
